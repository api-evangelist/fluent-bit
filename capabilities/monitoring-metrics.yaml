        idempotent: true
      call: monitoring-metrics.get
      outputParameters:
      - type: object
        mapping: $.
    - name: internal-metrics-v2-prometheus
      description: Internal metrics (v2, Prometheus)
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: monitoring-metrics.get
      outputParameters:
      - type: object
        mapping: $.
